name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (locked — no silent lockfile drift)
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Lint (0 errors; warnings tracked)
        run: bun run lint

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: DB push (SQLite)
        run: bunx prisma db push --accept-data-loss
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Unit / Integration / Security / Redteam tests
        run: bunx vitest run --reporter=verbose
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Benchmark (synthetic)
        run: bun run benchmark
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./prisma/dev.db
          # GEMINI_API_KEY / GROQ_API_KEY not required — transform falls back to mock offline

      - name: Check no secrets in build
        run: |
          # Env *names* (process.env.GEMINI_API_KEY) legitimately appear in server chunks;
          # fail only on *values*: Groq live keys (gsk_), Google AI keys (AIza), OpenAI (sk-).
          if grep -rE "gsk_[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,}|sk-(live|proj)-[A-Za-z0-9]{10,}" .next --include="*.js" 2>/dev/null | grep -v ".next/cache" | head -n 5; then
            echo "::error::Potential secret value found in build output — review."
            exit 1
          fi
          echo "Secret scan of build output completed."

      - name: Check security headers present
        run: |
          grep -q "Strict-Transport-Security" next.config.ts || (echo "::error::HSTS header missing from next.config.ts" && exit 1)
          grep -q "Content-Security-Policy" next.config.ts || (echo "::error::CSP header missing from next.config.ts" && exit 1)
          grep -q "X-Frame-Options" src/proxy.ts || (echo "::error::X-Frame-Options missing from proxy.ts" && exit 1)
          echo "Security headers present."

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone
          if-no-files-found: ignore
